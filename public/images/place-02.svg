<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" role="img">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"
      gradientTransform="rotate(60 0.5 0.5)">
      <stop offset="0%" stop-color="#D3CEC2"/>
      <stop offset="52%" stop-color="#AFA795"/>
      <stop offset="100%" stop-color="#7C7669"/>
    </linearGradient>
    <radialGradient id="light" cx="39%" cy="26%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="107"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soften">
      <feGaussianBlur stdDeviation="54.54545454545455"/>
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#field)"/>

  <!-- Two soft shapes so the field is not flat: a broad horizon and a pool of light. -->
  <g filter="url(#soften)" opacity="0.55">
    <ellipse cx="384.0" cy="224.00000000000003" rx="504.0" ry="240.0" fill="#D3CEC2" opacity="0.7"/>
    <ellipse cx="888.0" cy="624.0" rx="552.0" ry="272.0" fill="#7C7669" opacity="0.5"/>
  </g>

  <rect width="1200" height="800" fill="url(#light)"/>

  <!-- Grain, so it reads as a surface rather than a gradient. -->
  <rect width="1200" height="800" filter="url(#grain)" opacity="0.14"/>
</svg>
