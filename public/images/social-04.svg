<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 900" width="900" height="900" role="img">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"
      gradientTransform="rotate(70 0.5 0.5)">
      <stop offset="0%" stop-color="#E4DED1"/>
      <stop offset="52%" stop-color="#C8BFAC"/>
      <stop offset="100%" stop-color="#A79C86"/>
    </linearGradient>
    <radialGradient id="light" cx="36%" cy="52%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="185"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soften">
      <feGaussianBlur stdDeviation="40.90909090909091"/>
    </filter>
  </defs>

  <rect width="900" height="900" fill="url(#field)"/>

  <!-- Two soft shapes so the field is not flat: a broad horizon and a pool of light. -->
  <g filter="url(#soften)" opacity="0.55">
    <ellipse cx="288.0" cy="252.00000000000003" rx="378.0" ry="270.0" fill="#E4DED1" opacity="0.7"/>
    <ellipse cx="666.0" cy="702.0" rx="414.0" ry="306.0" fill="#A79C86" opacity="0.5"/>
  </g>

  <rect width="900" height="900" fill="url(#light)"/>

  <!-- Grain, so it reads as a surface rather than a gradient. -->
  <rect width="900" height="900" filter="url(#grain)" opacity="0.14"/>
</svg>
