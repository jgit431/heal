<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 690" width="1800" height="690" role="img">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"
      gradientTransform="rotate(70 0.5 0.5)">
      <stop offset="0%" stop-color="#CBCBB9"/>
      <stop offset="52%" stop-color="#98A187"/>
      <stop offset="100%" stop-color="#5B6650"/>
    </linearGradient>
    <radialGradient id="light" cx="53%" cy="48%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="133"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soften">
      <feGaussianBlur stdDeviation="81.81818181818181"/>
    </filter>
  </defs>

  <rect width="1800" height="690" fill="url(#field)"/>

  <!-- Two soft shapes so the field is not flat: a broad horizon and a pool of light. -->
  <g filter="url(#soften)" opacity="0.55">
    <ellipse cx="576.0" cy="193.20000000000002" rx="756.0" ry="207.0" fill="#CBCBB9" opacity="0.7"/>
    <ellipse cx="1332.0" cy="538.2" rx="828.0" ry="234.60000000000002" fill="#5B6650" opacity="0.5"/>
  </g>

  <rect width="1800" height="690" fill="url(#light)"/>

  <!-- Grain, so it reads as a surface rather than a gradient. -->
  <rect width="1800" height="690" filter="url(#grain)" opacity="0.14"/>
</svg>
