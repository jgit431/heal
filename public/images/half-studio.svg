<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1320" width="1100" height="1320" role="img">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"
      gradientTransform="rotate(30 0.5 0.5)">
      <stop offset="0%" stop-color="#EDE4D4"/>
      <stop offset="52%" stop-color="#D6C4A8"/>
      <stop offset="100%" stop-color="#AE9773"/>
    </linearGradient>
    <radialGradient id="light" cx="56%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="55"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soften">
      <feGaussianBlur stdDeviation="60.0"/>
    </filter>
  </defs>

  <rect width="1100" height="1320" fill="url(#field)"/>

  <!-- Two soft shapes so the field is not flat: a broad horizon and a pool of light. -->
  <g filter="url(#soften)" opacity="0.55">
    <ellipse cx="352.0" cy="369.6" rx="462.0" ry="396.0" fill="#EDE4D4" opacity="0.7"/>
    <ellipse cx="814.0" cy="1029.6000000000001" rx="506.0" ry="448.8" fill="#AE9773" opacity="0.5"/>
  </g>

  <rect width="1100" height="1320" fill="url(#light)"/>

  <!-- Grain, so it reads as a surface rather than a gradient. -->
  <rect width="1100" height="1320" filter="url(#grain)" opacity="0.14"/>
</svg>
