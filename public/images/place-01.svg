<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1330" width="1000" height="1330" role="img">
  <defs>
    <linearGradient id="field" x1="0" y1="0" x2="1" y2="1"
      gradientTransform="rotate(25 0.5 0.5)">
      <stop offset="0%" stop-color="#E4DED1"/>
      <stop offset="52%" stop-color="#C8BFAC"/>
      <stop offset="100%" stop-color="#A79C86"/>
    </linearGradient>
    <radialGradient id="light" cx="32%" cy="55%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" seed="94"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
    <filter id="soften">
      <feGaussianBlur stdDeviation="60.45454545454545"/>
    </filter>
  </defs>

  <rect width="1000" height="1330" fill="url(#field)"/>

  <!-- Two soft shapes so the field is not flat: a broad horizon and a pool of light. -->
  <g filter="url(#soften)" opacity="0.55">
    <ellipse cx="320.0" cy="372.40000000000003" rx="420.0" ry="399.0" fill="#E4DED1" opacity="0.7"/>
    <ellipse cx="740.0" cy="1037.4" rx="460.0" ry="452.20000000000005" fill="#A79C86" opacity="0.5"/>
  </g>

  <rect width="1000" height="1330" fill="url(#light)"/>

  <!-- Grain, so it reads as a surface rather than a gradient. -->
  <rect width="1000" height="1330" filter="url(#grain)" opacity="0.14"/>
</svg>
