<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Heal — pilates studio and cafe</title>
    <meta
      name="description"
      content="Heal is a pilates studio and a cafe in one room. Small classes, slow mornings, coffee and food cooked to order."
    />

    <!-- Theme colour matches --ground so mobile browser chrome blends into the page -->
    <meta name="theme-color" content="#DED8CC" />

    <!-- Favicon: the wordmark mark, drawn as an inline SVG so there is no extra request -->
    <link rel="icon" href="/images/mark.svg" type="image/svg+xml" />

    <!--
      Typefaces:
      Marcellus  — headings and the wordmark. A roman face with carved, quiet capitals.
      Jost       — body, navigation, prices. Geometric, light, gets out of the way.
      Swap these in one place: here, and the --font-* tokens in src/styles/base.css.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Jost:ital,wght@0,300;0,400;0,500;1,300&family=Marcellus&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
